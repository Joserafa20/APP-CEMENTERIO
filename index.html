<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cementerio Municipal de Sabanalarga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f14;--surface:#1a1a24;--surface2:#22222f;--surface3:#2a2a3a;
  --border:#2e2e42;--border2:#3d3d58;
  --text:#e8e8f0;--text2:#9090b0;--text3:#606080;
  --l1:#7c5cbf;--l1l:#c8b4f0;--l1bg:#1e1630;
  --l2:#4e9e88;--l2l:#90d4c0;--l2bg:#0f2420;
  --l3:#bf7c5c;--l3l:#f0c8a0;--l3bg:#2a1c10;
  --green:#4caf7d;--greenbg:#0d2018;
  --yellow:#e8b84b;--red:#e85858;
  --radius:10px;--shadow:0 4px 24px rgba(0,0,0,.5);
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1a1428 0%,#141420 60%,#1a2814 100%);border-bottom:1px solid var(--border);padding:20px 24px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hdr-icon{font-size:2rem;line-height:1}
.hdr-title h1{font-size:1.3rem;font-weight:700;letter-spacing:.3px}
.hdr-title p{font-size:.8rem;color:var(--text2);margin-top:2px}
.stats-row{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:.82rem}
.stat-val{font-size:1.1rem;font-weight:700;line-height:1}
.stat-lbl{color:var(--text2);font-size:.75rem}

/* TOOLBAR */
.toolbar{padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4;width:16px;height:16px}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-size:.88rem;outline:none;transition:border .15s}
.search-wrap input:focus{border-color:var(--border2)}
.search-wrap input::placeholder{color:var(--text3)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 13px;color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--border2);color:var(--text)}
.btn.active{background:var(--surface3);border-color:var(--border2);color:var(--text)}
.btn.b1.active{background:var(--l1bg);border-color:var(--l1);color:var(--l1l)}
.btn.b2.active{background:var(--l2bg);border-color:var(--l2);color:var(--l2l)}
.btn.b3.active{background:var(--l3bg);border-color:var(--l3);color:var(--l3l)}
.btn.bpaz.active{background:var(--greenbg);border-color:var(--green);color:var(--green)}

/* LEGEND */
.legend{padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.leg-item{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text2)}
.leg-dot{width:11px;height:11px;border-radius:50%}

/* MAIN LAYOUT */
.layout{display:flex;gap:0;height:calc(100vh - 200px);overflow:hidden}
.sections-panel{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.sections-panel::-webkit-scrollbar{width:6px}
.sections-panel::-webkit-scrollbar-track{background:transparent}
.sections-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* SECTION */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;transition:background .15s}
.sec-hdr:hover{background:var(--surface2)}
.sec-left{display:flex;align-items:center;gap:10px}
.sec-name{font-size:.95rem;font-weight:700;letter-spacing:.5px}
.sec-badge{font-size:.72rem;padding:3px 8px;border-radius:5px;font-weight:600}
.sec-meta{display:flex;gap:8px;margin-top:1px}
.sec-pill{font-size:.7rem;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
.sec-pill.paz{color:var(--green)}
.sec-arrow{color:var(--text3);font-size:.75rem;transition:transform .2s}
.sec-hdr.open .sec-arrow{transform:rotate(180deg)}
.sec-body{display:none;padding:14px 16px;border-top:1px solid var(--border)}
.sec-body.open{display:block}

/* FOLIO GROUP */
.folio-grp{margin-bottom:16px}
.folio-lbl{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.vaults-grid{display:flex;flex-wrap:wrap;gap:6px}

/* VAULT CELL */
.vault{width:72px;height:52px;border-radius:7px;border:1.5px solid;cursor:pointer;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;transition:all .15s;position:relative;overflow:hidden}
.vault:hover{transform:translateY(-2px);filter:brightness(1.2)}
.vault.sel{outline:2px solid #fff;outline-offset:1px;transform:translateY(-2px);filter:brightness(1.3)}
.vault.sm{outline:2px solid var(--yellow);outline-offset:1px}
.vault.sh2{opacity:.12;pointer-events:none}
.vault-num{font-size:.65rem;font-weight:700;line-height:1;opacity:.9}
.vault-name{font-size:.6rem;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;opacity:.75}
.paz-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.vault.l1{background:var(--l1bg);border-color:var(--l1);color:var(--l1l)}
.vault.l2{background:var(--l2bg);border-color:var(--l2);color:var(--l2l)}
.vault.l3{background:var(--l3bg);border-color:var(--l3);color:var(--l3l)}

/* DETAIL PANEL */
.detail-panel{width:320px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;transition:width .25s,opacity .25s;position:relative}
.detail-panel.empty{width:0;opacity:0;overflow:hidden}
.detail-panel::-webkit-scrollbar{width:5px}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.detail-inner{padding:0;min-width:300px}

/* DETAIL HEADER */
.det-hdr{padding:20px;border-bottom:1px solid var(--border);position:relative}
.det-close{position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:1rem;transition:all .15s}
.det-close:hover{background:var(--surface3);color:var(--text)}
.det-vault-num{font-size:2rem;font-weight:800;line-height:1;margin-bottom:4px}
.det-calle{font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.det-libro-badge{font-size:.7rem;padding:2px 8px;border-radius:4px;font-weight:600}

/* DETAIL SECTIONS */
.det-section{padding:16px 20px;border-bottom:1px solid var(--border)}
.det-section:last-child{border-bottom:none}
.det-sec-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:12px}
.det-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.det-row:last-child{margin-bottom:0}
.det-label{font-size:.78rem;color:var(--text2);flex-shrink:0}
.det-val{font-size:.82rem;text-align:right;word-break:break-word}
.det-val.empty-val{color:var(--text3);font-style:italic}

/* PAZ STATUS */
.paz-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:.8rem;font-weight:600}
.paz-badge.si{background:var(--greenbg);border:1px solid var(--green);color:var(--green)}
.paz-badge.no{background:rgba(232,88,88,.1);border:1px solid rgba(232,88,88,.3);color:#e88888}

/* RECIBO */
.recibo-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:.82rem;font-family:monospace;letter-spacing:.5px;color:var(--l1l)}

/* NICHOS */
.nicho-info{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nicho-stat{text-align:center}
.nicho-stat .n-val{font-size:1.4rem;font-weight:700;line-height:1}
.nicho-stat .n-lbl{font-size:.7rem;color:var(--text2);margin-top:3px}

/* RESULTS BAR */
.results-bar{padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--border);font-size:.78rem;color:var(--text2)}
.results-bar span{color:var(--text);font-weight:600}

/* EMPTY STATE */
.empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center;color:var(--text3)}
.empty-detail svg{opacity:.2;margin-bottom:16px;width:48px;height:48px}
.empty-detail p{font-size:.85rem;line-height:1.6}

/* NO RESULTS */
.no-results{text-align:center;padding:40px 20px;color:var(--text3);font-size:.88rem}

/* RESPONSIVE */
@media(max-width:768px){
  .layout{flex-direction:column;height:auto}
  .detail-panel{width:100%;border-left:none;border-top:1px solid var(--border)}
  .detail-panel.empty{width:100%;height:0;opacity:0}
  .sections-panel{padding:14px}
  .hdr{padding:14px}
  .toolbar{padding:10px 14px}
  .legend{padding:8px 14px}
  .stats-row{gap:7px}
  .stat{padding:6px 10px}
}
</style>
</head>

  <div class="leg-item"><div class="leg-dot" style="background:var(--l3)"></div>Libro 3</div>
  <div style="width:1px;height:14px;background:var(--border);margin:0 4px"></div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Paz y salvo</div>
</div>

<div class="results-bar" id="results-bar"><span id="rb-count">447</span> bóvedas encontradas</div>

<div class="layout">

  </div>
</div>

const SECTION_ORDER=['CRA 1A','CRA 1B','CRA 2','CALLE 7','CALLE 8','CALLE 9','CALLE 10','CALLE 16','CALLE 17','CALLE 18','CALLE 18B'];
const LIB_COLOR={1:'var(--l1)',2:'var(--l2)',3:'var(--l3)'};
const LIB_LABEL={1:'var(--l1l)',2:'var(--l2l)',3:'var(--l3l)'};
const LIB_BG={1:'var(--l1bg)',2:'var(--l2bg)',3:'var(--l3bg)'};

let currentFilter='all';
let currentSearch='';
let selectedId=null;

// Build grouped data
const bySection={};
const byFolio={};
D.forEach((d,i)=>{
  d._id=i;
  if(!bySection[d.calle]) bySection[d.calle]=[];
  bySection[d.calle].push(d);
  const fk=d.calle+'|'+d.folio;
  if(!byFolio[fk]) byFolio[fk]=[];
  byFolio[fk].push(d);
});

function matches(d){
  if(currentFilter==='paz' && !d.paz_salvo) return false;
  if(currentFilter==='1' && d.libro!=='1') return false;
  if(currentFilter==='2' && d.libro!=='2') return false;
  if(currentFilter==='3' && d.libro!=='3') return false;
  if(currentSearch){
    const q=currentSearch.toLowerCase();
    return d.num.toLowerCase().includes(q)||
           d.propietario.toLowerCase().includes(q)||
           (d.direccion||'').toLowerCase().includes(q);
  }
  return true;
}

function buildSections(){
  const panel=document.getElementById('sections-panel');
  panel.innerHTML='';
  let totalVis=0;
  let secVis=0;

  SECTION_ORDER.forEach(sec=>{
    const vaults=bySection[sec];
    if(!vaults) return;
    
    const visVaults=vaults.filter(matches);
    if(visVaults.length===0) return;
    secVis++;
    totalVis+=visVaults.length;
    
    const libro=vaults[0].libro;
    const conPaz=visVaults.filter(v=>v.paz_salvo).length;
    
    // Folio grouping
    const folios={};
    vaults.forEach(v=>{
      if(!folios[v.folio]) folios[v.folio]=[];
      folios[v.folio].push(v);
    });
    const folioKeys=Object.keys(folios).sort((a,b)=>parseInt(a)-parseInt(b));
    
    const div=document.createElement('div');
    div.className='section';
    div.id='sec-'+sec.replace(/\s/g,'');
    
    const lc=LIB_COLOR[libro];
    const ll=LIB_LABEL[libro];
    
    div.innerHTML=`
      <div class="sec-hdr" onclick="toggleSec(this)">
        <div class="sec-left">
          <div class="sec-name" style="color:${ll}">${sec}</div>
          <div class="sec-meta">
            <span class="sec-pill">${visVaults.length} bóvedas</span>
            <span class="sec-pill">${folioKeys.length} folios</span>
            ${conPaz>0?`<span class="sec-pill paz">✓ ${conPaz} paz y salvo</span>`:''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="sec-badge" style="background:${LIB_BG[libro]};border:1px solid ${lc};color:${ll}">Libro ${libro}</span>
          <span class="sec-arrow">▼</span>
        </div>
      </div>
      <div class="sec-body open" id="body-${sec.replace(/\s/g,'')}">
        ${folioKeys.map(fk=>{
          const fvaults=folios[fk];
          const visF=fvaults.filter(matches);
          if(visF.length===0) return '';
          return `<div class="folio-grp">
            <div class="folio-lbl">Folio N° ${fk} &mdash; ${fvaults.length} bóveda${fvaults.length!==1?'s':''}</div>
            <div class="vaults-grid">
              ${fvaults.map(v=>{
                const vis=matches(v);
                const sel=v._id===selectedId?' sel':'';
                const sm=(currentSearch&&vis)?' sm':'';
                const hidden=(!vis)?' sh2':'';
                return `<div class="vault l${v.libro}${sel}${sm}${hidden}" 
                  id="vault-${v._id}" 
                  onclick="showDetail(${v._id})"
                  title="${v.propietario}">
                  <div class="vault-num">${v.num}</div>
                  <div class="vault-name">${v.propietario.split(' ').slice(0,2).join(' ')}</div>
                  ${v.paz_salvo?'<div class="paz-dot"></div>':''}
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
    panel.appendChild(div);
  });

  if(panel.children.length===0){
    panel.innerHTML='<div class="no-results">No se encontraron bóvedas con los filtros actuales.</div>';
  }

  // Update stats
  document.getElementById('st-total').textContent=D.length;
  document.getElementById('st-paz').textContent=D.filter(d=>d.paz_salvo).length;
  document.getElementById('st-recibo').textContent=D.filter(d=>d.recibo).length;
  document.getElementById('st-secciones').textContent=SECTION_ORDER.filter(s=>bySection[s]).length;
  document.getElementById('rb-count').textContent=totalVis;
  document.getElementById('results-bar').querySelector('span').nextSibling.textContent=
    totalVis===D.length?' bóvedas encontradas':` de ${D.length} bóvedas`;
}

function toggleSec(hdr){
  hdr.classList.toggle('open');
  const id='body-'+hdr.closest('.section').id.replace('sec-','');
  const body=document.getElementById(id);
  if(body) body.classList.toggle('open');
}

function setFilter(btn,f){
  currentFilter=f;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildSections();
}

function doSearch(val){
  currentSearch=val.trim();
  buildSections();
  if(currentSearch) openAllSections();
}

function openAllSections(){
  document.querySelectorAll('.sec-hdr').forEach(h=>h.classList.add('open'));
  document.querySelectorAll('.sec-body').forEach(b=>b.classList.add('open'));
}

function showDetail(id){
  selectedId=id;
  const d=D[id];
  
  // Update selected vault
  document.querySelectorAll('.vault').forEach(v=>v.classList.remove('sel'));
  const el=document.getElementById('vault-'+id);
  if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest',behavior:'smooth'});}

  // Section stats for this vault
  const secVaults=bySection[d.calle]||[];
  const folioVaults=secVaults.filter(v=>v.folio===d.folio);
  const folioConPaz=folioVaults.filter(v=>v.paz_salvo).length;
  const folioSinPaz=folioVaults.length-folioConPaz;
  const ownerVaults=D.filter(v=>v.propietario&&v.propietario.trim().toLowerCase()===d.propietario.trim().toLowerCase());
  
  const libro=d.libro;
  const lc=LIB_COLOR[libro];
  const ll=LIB_LABEL[libro];
  const lb=LIB_BG[libro];
  
  const panel=document.getElementById('detail-panel');
  const inner=document.getElementById('detail-inner');
  panel.classList.remove('empty');

  inner.innerHTML=`
    <div class="det-hdr">
      <button class="det-close" onclick="closeDetail()">✕</button>
      <div class="det-vault-num" style="color:${ll}">Bóveda ${d.num}</div>
      <div class="det-calle">
        <span>📍 ${d.calle}</span>
        <span class="det-libro-badge" style="background:${lb};border:1px solid ${lc};color:${ll}">Libro ${libro} · Folio ${d.folio}</span>
      </div>
    </div>

    <div class="det-section">
      <div class="det-sec-title">Información del propietario</div>
      <div class="det-row">
        <span class="det-label">Propietario</span>
        <span class="det-val" style="font-weight:600">${d.propietario||'<span class="empty-val">Sin registro</span>'}</span>
      </div>
      <div class="det-row">
        <span class="det-label">Dirección</span>
        <span class="det-val">${d.direccion||'<span class="empty-val">No registrada</span>'}</span>
      </div>
    </div>

    <div class="det-section">
      <div class="det-sec-title">Estado de pagos</div>
      <div class="det-row">
        <span class="det-label">Paz y Salvo</span>
        <span class="det-val">
          ${d.paz_salvo
            ?`<span class="paz-badge si">✓ Al día · ${d.paz_salvo}</span>`
            :`<span class="paz-badge no">✗ Sin registro</span>`}
        </span>
      </div>
      <div class="det-row">
        <span class="det-label">N° Recibo</span>
        <span class="det-val">
          ${d.recibo
            ?`<span class="recibo-chip">${d.recibo}</span>`
            :`<span class="empty-val">No registrado</span>`}
        </span>
      </div>
    </div>

    <div class="det-section">
      <div class="det-sec-title">Ubicación en el cementerio</div>
      <div class="nicho-info">
        <div class="nicho-stat">
          <div class="n-val" style="color:${ll}">${ownerVaults.length}</div>
          <div class="n-lbl">Nichos del propietario</div>
        </div>
        <div class="nicho-stat">
          <div class="n-val" style="color:${ll}">${folioVaults.length}</div>
          <div class="n-lbl">Bóvedas en Folio ${d.folio}</div>
        </div>
        <div class="nicho-stat">
          <div class="n-val" style="color:var(--green)">${folioConPaz}</div>
          <div class="n-lbl">Paz y salvo en Folio ${d.folio}</div>
        </div>
        <div class="nicho-stat">
          <div class="n-val" style="color:var(--text2)">${folioSinPaz}</div>
          <div class="n-lbl">Sin paz y salvo en Folio ${d.folio}</div>
        </div>
      </div>
    </div>

    <div class="det-section">
      <div class="det-sec-title">Otros nichos en Folio ${d.folio}</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${folioVaults.map(v=>`
          <div onclick="showDetail(${v._id})" style="cursor:pointer;background:${v._id===id?lb:'var(--surface2)'};border:1px solid ${v._id===id?lc:'var(--border)'};border-radius:6px;padding:4px 8px;font-size:.75rem;color:${v._id===id?ll:'var(--text2)'};transition:all .15s"
            title="${v.propietario}">
            ${v.num}${v.paz_salvo?` <span style="color:var(--green);font-size:.65rem">●</span>`:''}
          </div>`).join('')}
      </div>
    </div>
  `;
}

function closeDetail(){
  selectedId=null;
  document.querySelectorAll('.vault').forEach(v=>v.classList.remove('sel'));
  document.getElementById('detail-panel').classList.add('empty');
  document.getElementById('detail-inner').innerHTML=`
    <div class="empty-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
      <p>Haz clic en una bóveda para ver su información completa</p>
    </div>`;
}

buildSections();
</script>
</body>
</html>
